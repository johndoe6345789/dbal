# Builds the DBAL daemon image for both architectures and publishes a single
# multi-arch manifest to GHCR.
#
# Each architecture is built on its own native runner rather than cross-built
# under QEMU: the image compiles the daemon from source (boost, drogon,
# mongo-cxx-driver, xmlsec all built by Conan), which emulation would slow by
# roughly 5-10x. Each leg pushes an arch-tagged image; the merge job then joins
# them into one manifest so `docker pull` resolves the right architecture.
name: docker

on:
  push:
    branches: [main]
    paths:
      - 'libraries/dbal/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/johndoe6345789/dbal

jobs:
  build:
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The builder stage is FROM ${BASE_REGISTRY}/base-conan-dbal:latest,
      # defaulting to metabuilder/base-conan-dbal (switched from base-apt so
      # the daemon's Conan dependencies -- drogon, boost, mongo-c-driver, ICU,
      # LibXml2 -- resolve from a warm cache instead of compiling from source
      # on every build; see the Dockerfile's header comment). That image is
      # published by github.com/johndoe6345789/deployment, not built here, so
      # pull it and retag it to the local name the Dockerfile expects -- the
      # same thing metabuilder's own docker.yml does for its own bases, and
      # what the deployment repo's base-images.yml header documents.
      #
      # A stale base is slower, never wrong: the Dockerfile re-runs its own
      # `conan install --build=missing`, so this never waits on the base
      # pipeline for a dependency added since the base was last published.
      - name: Pull base-conan-dbal
        env:
          REMOTE: ghcr.io/johndoe6345789/deployment/base-conan-dbal:latest
        run: |
          if ! docker pull "$REMOTE"; then
            echo "::error::Could not pull $REMOTE"
            echo "Base images come from github.com/johndoe6345789/deployment"
            echo "  -> its 'base-images' workflow must have completed at least"
            echo "     once, including the manifest job that creates :latest."
            exit 1
          fi
          docker tag "$REMOTE" metabuilder/base-conan-dbal:latest

      # Context is libraries/dbal: the Dockerfile reaches for both production/
      # and shared/, so it needs the directory that contains both.
      - name: Build image
        env:
          ARCH: ${{ matrix.arch }}
          SHA: ${{ github.sha }}
        run: |
          docker build \
            -f libraries/dbal/production/build-config/Dockerfile \
            --build-arg BUILD_TYPE=Release \
            --build-arg DBAL_GIT_COMMIT="${SHA}" \
            -t "$IMAGE:${SHA}-${ARCH}" \
            libraries/dbal

      # Verifies the runtime stage actually contains what its ENV points at.
      # Both entities/ and templates/ were missing before and would have failed
      # only at daemon startup, after publication.
      - name: Smoke test image contents
        env:
          ARCH: ${{ matrix.arch }}
          SHA: ${{ github.sha }}
        run: |
          docker run --rm --entrypoint sh "$IMAGE:${SHA}-${ARCH}" -c '
            set -e
            test -x /app/dbal_daemon        || { echo "daemon missing"; exit 1; }
            test -d /app/schemas/entities   || { echo "DBAL_SCHEMA_DIR target missing"; exit 1; }
            test -d /app/templates/sql      || { echo "DBAL_TEMPLATE_DIR target missing"; exit 1; }
            test -d /app/schemas/auth       || { echo "auth config missing"; exit 1; }
            test -d /app/seeds/database     || { echo "seed data missing"; exit 1; }
            echo "entities:  $(ls /app/schemas/entities | wc -l)"
            echo "templates: $(ls /app/templates/sql | wc -l)"
          '

      - name: Report image size
        env:
          ARCH: ${{ matrix.arch }}
          SHA: ${{ github.sha }}
        run: |
          SIZE=$(docker image inspect "$IMAGE:${SHA}-${ARCH}" --format '{{.Size}}')
          {
            echo "### Image (${ARCH})"
            echo
            echo "size: $((SIZE / 1024 / 1024)) MB"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push
        env:
          ARCH: ${{ matrix.arch }}
          SHA: ${{ github.sha }}
        run: docker push "$IMAGE:${SHA}-${ARCH}"

  manifest:
    name: multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Joins the two arch-tagged images into one manifest list, so a plain
      # `docker pull ghcr.io/johndoe6345789/dbal` resolves per-platform.
      - name: Create and push manifest
        env:
          SHA: ${{ github.sha }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:${SHA}" \
            "$IMAGE:${SHA}-amd64" \
            "$IMAGE:${SHA}-arm64"

      - name: Verify manifest platforms
        env:
          SHA: ${{ github.sha }}
        run: |
          docker buildx imagetools inspect "$IMAGE:${SHA}"
          RAW=$(docker buildx imagetools inspect "$IMAGE:${SHA}" --raw)
          for want in amd64 arm64; do
            echo "$RAW" | grep -q "\"$want\"" \
              || { echo "manifest is missing linux/$want"; exit 1; }
          done
          echo "manifest covers linux/amd64 and linux/arm64"
