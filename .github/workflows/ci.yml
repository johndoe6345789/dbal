# Written by hand, not by the reposplit workflow generator: that generator only
# scanned for CMakeLists.txt at shallow depth, so it built the Next.js frontend
# and ignored the daemon entirely. The daemon is what this repo is for.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  daemon:
    name: DBAL daemon (C++)
    runs-on: ubuntu-latest
    # Conan builds drogon, boost, mongo-cxx-driver and xmlsec from source on a
    # cold cache, which is slow. Later runs restore from the cache below.
    timeout-minutes: 120

    defaults:
      run:
        working-directory: libraries/dbal

    steps:
      - uses: actions/checkout@v7

      # uuid-dev is required by src/adapters/elasticsearch, which includes
      # <uuid/uuid.h> directly with no find_package, so CMake configures
      # happily and only fails at compile time. The postgres/mysql/zlib dev
      # packages are declared explicitly rather than relied on from the runner
      # image, since CMakeLists marks all three REQUIRED.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libssl-dev perl \
            uuid-dev libpq-dev default-libmysqlclient-dev zlib1g-dev

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Conan
        run: pip install --upgrade 'conan>=2.1'

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2
          key: conan-dbal-${{ runner.os }}-${{ hashFiles('libraries/dbal/production/build-config/conanfile.py') }}
          restore-keys: |
            conan-dbal-${{ runner.os }}-

      - name: Conan install
        run: |
          conan profile detect --force
          conan install production/build-config \
            --output-folder="$PWD/_build" \
            --build=missing \
            -s build_type=Release \
            -s compiler.cppstd=20

      # conanfile.py uses cmake_layout, so the toolchain lands under a
      # build-type subdirectory whose exact path varies by Conan version. The
      # project's own Dockerfile locates it the same way.
      - name: Locate Conan toolchain
        id: toolchain
        run: |
          TC=$(find "$PWD/_build" -name conan_toolchain.cmake -print -quit)
          test -n "$TC" || { echo "conan_toolchain.cmake not found under _build"; exit 1; }
          echo "path=$TC" >> "$GITHUB_OUTPUT"
          echo "toolchain: $TC"

      # CMakeLists resolves DBAL_REPO_ROOT as production/.., i.e. libraries/dbal,
      # so shared/ and templates/ are found in place. It also runs
      # shared/tools/codegen/gen_types.py to emit types.generated.hpp when absent.
      - name: Configure
        env:
          TOOLCHAIN: ${{ steps.toolchain.outputs.path }}
        run: |
          cmake -S production -B _build/cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN"

      - name: Build
        run: cmake --build _build/cmake --parallel "$(nproc)"

      - name: Confirm binary
        run: |
          BIN=$(find _build/cmake -name dbal_daemon -type f -perm -u+x | head -1)
          test -n "$BIN" || { echo "dbal_daemon was not produced"; exit 1; }
          echo "built: $BIN"
          file "$BIN"

      - name: Upload daemon
        uses: actions/upload-artifact@v7
        with:
          name: dbal_daemon
          path: libraries/dbal/_build/cmake/dbal_daemon
          if-no-files-found: error
