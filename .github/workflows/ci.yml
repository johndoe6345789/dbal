# Written by hand, not by the reposplit workflow generator: that generator only
# scanned for CMakeLists.txt at shallow depth, so it built the Next.js frontend
# and ignored the daemon entirely. The daemon is what this repo is for.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  daemon:
    name: DBAL daemon (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Conan builds drogon, boost, mongo-cxx-driver and xmlsec from source on a
    # cold cache, which is slow. Later runs restore from the cache below.
    timeout-minutes: 120

    strategy:
      # Report both architectures rather than stopping at the first failure -
      # an arm64-only problem is exactly what this matrix exists to catch.
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            # Native arm64 hardware, free for public repositories. Emulating
            # this under QEMU would multiply a source build of boost/drogon/
            # mongo-cxx-driver by roughly 5-10x.
            runner: ubuntu-24.04-arm

    defaults:
      run:
        working-directory: libraries/dbal

    steps:
      - uses: actions/checkout@v7

      # uuid-dev is required by src/adapters/elasticsearch, which includes
      # <uuid/uuid.h> directly with no find_package, so CMake configures
      # happily and only fails at compile time. The postgres/mysql/zlib dev
      # packages are declared explicitly rather than relied on from the runner
      # image, since CMakeLists marks all three REQUIRED.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libssl-dev perl \
            uuid-dev libpq-dev default-libmysqlclient-dev zlib1g-dev

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Conan
        run: pip install --upgrade 'conan>=2.1'

      # Keyed on arch: the cache holds compiled binaries, so sharing one key
      # between x64 and arm64 would serve the wrong architecture's packages.
      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2
          key: conan-dbal-${{ matrix.arch }}-${{ hashFiles('libraries/dbal/production/build-config/conanfile.py') }}
          restore-keys: |
            conan-dbal-${{ matrix.arch }}-

      - name: Conan install
        run: |
          conan profile detect --force
          conan install production/build-config \
            --output-folder="$PWD/_build" \
            --build=missing \
            -s build_type=Release \
            -s compiler.cppstd=20

      # conanfile.py uses cmake_layout, so the toolchain lands under a
      # build-type subdirectory whose exact path varies by Conan version. The
      # project's own Dockerfile locates it the same way.
      - name: Locate Conan toolchain
        id: toolchain
        run: |
          TC=$(find "$PWD/_build" -name conan_toolchain.cmake -print -quit)
          test -n "$TC" || { echo "conan_toolchain.cmake not found under _build"; exit 1; }
          echo "path=$TC" >> "$GITHUB_OUTPUT"
          echo "toolchain: $TC"

      # CMakeLists resolves DBAL_REPO_ROOT as production/.., i.e. libraries/dbal,
      # so shared/ and templates/ are found in place. It also runs
      # shared/tools/codegen/gen_types.py to emit types.generated.hpp when absent.
      # BUILD_TESTING=ON is what makes the GTest suites compile at all. It
      # defaults to OFF (production Docker builds do not copy tests/), and this
      # workflow never overrode it -- so every unit and security test under
      # tests/ was dead weight in CI: built never, run never. gtest/1.14.0 is
      # already a Conan requirement and find_package(GTest REQUIRED) already
      # runs unconditionally, so nothing else has to change to switch them on.
      #
      # BUILD_INTEGRATION_TESTS stays off: those want live PostgreSQL/MySQL via
      # testcontainers, which is separate CI plumbing.
      - name: Configure
        env:
          TOOLCHAIN: ${{ steps.toolchain.outputs.path }}
        run: |
          cmake -S production -B _build/cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN"

      - name: Build
        run: cmake --build _build/cmake --parallel "$(nproc)"

      # --no-tests=error so that a future refactor which stops registering the
      # test target fails loudly instead of reporting a green run with 0 tests,
      # which is the failure mode that hid these suites in the first place.
      - name: Test
        run: ctest --test-dir _build/cmake --output-on-failure --no-tests=error

      # Asserts the ELF machine type, so the arm64 leg proves it really produced
      # an aarch64 binary rather than silently building x86 twice.
      - name: Confirm binary
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          BIN=$(find _build/cmake -name dbal_daemon -type f -perm -u+x | head -1)
          test -n "$BIN" || { echo "dbal_daemon was not produced"; exit 1; }
          echo "built: $BIN"
          file "$BIN"

          case "$ARCH" in
            arm64) want="aarch64" ;;
            x64)   want="x86-64" ;;
            *)     echo "unknown arch: $ARCH"; exit 1 ;;
          esac
          if ! file "$BIN" | grep -q "$want"; then
            echo "expected a $want binary for $ARCH, got:"
            file "$BIN"
            exit 1
          fi
          echo "confirmed $ARCH binary ($want)"

      - name: Upload daemon
        uses: actions/upload-artifact@v7
        with:
          # Names must differ per matrix leg; a shared name fails on upload.
          name: dbal_daemon-${{ matrix.arch }}
          path: libraries/dbal/_build/cmake/dbal_daemon
          if-no-files-found: error
